<style>
/* Layout: phone-first app shell — sticky top bar, one scrolling page, bottom tab bar, floating "+ Job" button */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --sunk:#E7E9E2; --line:#D2D6CC;
  --ink:#1D2220; --muted:#596560; --accent:#245F8F; --accent-ink:#FFFFFF; --accent-soft:#DCE7F2;
  --good:#2B6A4C; --good-soft:#D9EADF; --warn:#9A620E; --warn-soft:#F6E9C8; --danger:#AE3F2B; --danger-soft:#F5DDD7;
  --orange:#B4530F; --orange-soft:#F8E1CF; --teal:#13707A; --teal-soft:#D3ECEE;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --nav:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121514; --surface:#1A1E1D; --sunk:#242927; --line:#323936;
  --ink:#E4E9E6; --muted:#9AA5A0; --accent:#86B6E3; --accent-ink:#0C1724; --accent-soft:#1E2F42;
  --good:#74C49A; --good-soft:#1F3B2C; --warn:#E2AA55; --warn-soft:#3A2E18; --danger:#E9856F; --danger-soft:#3E231D;
  --orange:#F0A060; --orange-soft:#3D2716; --teal:#6CC6CF; --teal-soft:#16343A;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:56px}
.top h1{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{appearance:none;border:0;background:var(--sunk);width:38px;height:38px;border-radius:19px;font-size:1.3rem;cursor:pointer;display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.sync{appearance:none;border:0;background:var(--sunk);color:var(--muted);font:600 .78rem var(--body);padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.sync.ok{background:var(--good-soft);color:var(--good)}
.sync.wait{background:var(--warn-soft);color:var(--warn)}
.sync.err{background:var(--danger-soft);color:var(--danger)}
main{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav) + 90px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav);padding:0 max(4px,env(safe-area-inset-left,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600;position:relative}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--accent)}
.nav .dot{position:absolute;top:8px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:.66rem;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;height:52px;padding:0 20px;font:700 1.05rem var(--body);box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hi{border-color:var(--accent)}
.sec-top{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
h2.sec,h3.sec{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem} .m0{margin:0}
.empty{margin:0;color:var(--muted)}
label.lab,legend{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical;line-height:1.4}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--good);padding:0;flex-shrink:0;cursor:pointer}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.row.end{justify-content:flex-end}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem var(--body);padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.g{background:var(--good);color:var(--surface);border-color:var(--good)}

.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{min-height:36px;padding:6px 11px;font-size:.88rem}
.btn.wide{flex:1}
.btn[disabled]{opacity:.5}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick .btn{flex-direction:column;gap:2px;font-size:.8rem;padding:8px 4px}
.quick .btn svg{width:22px;height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);font:500 .9rem var(--body);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .n{opacity:.7;font-variant-numeric:tabular-nums}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.st-new{background:var(--accent-soft);color:var(--accent)}
.st-waiting{background:var(--warn-soft);color:var(--warn)}
.st-followup{background:var(--orange-soft);color:var(--orange)}
.st-scheduled{background:var(--teal-soft);color:var(--teal)}
.st-done{background:var(--good-soft);color:var(--good)}
.st-unpaid{background:var(--danger-soft);color:var(--danger)}
.st-paid{background:var(--sunk);color:var(--muted)}
.st-cancelled{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.list{display:flex;flex-direction:column}
.list > * + *{border-top:1px solid var(--line)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;color:inherit;text-decoration:none;min-width:0}
.item .l{display:flex;flex-direction:column;min-width:0;gap:1px}
.item .l b{font-weight:600;overflow-wrap:anywhere}
.item .l span{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.item .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums}
a.item:active{background:var(--sunk)}
.todo{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0}
.todo .t{min-width:0;overflow-wrap:anywhere}
.todo .t small{display:block;color:var(--muted)}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.when{font-size:.76rem;font-weight:700;white-space:nowrap}
.bad{color:var(--danger)} .warn{color:var(--warn)} .good{color:var(--good)}
.x{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:1.1rem;flex-shrink:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--sunk);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile b{font-family:var(--display);font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted)}
.cust-box{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;color:inherit;text-decoration:none}
.cust-box b{font-size:1.05rem}
.hist{font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.hist div{display:flex;justify-content:space-between;gap:10px}
.hist div span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.money{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.money .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.money .bal{font-weight:700;font-size:1.1rem}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:.9rem}
.thumb .tag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.66rem;font-weight:700;padding:1px 5px;border-radius:4px;text-transform:uppercase}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.bars div{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.cur{background:var(--good)}
.blab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;font-size:.68rem;color:var(--muted);text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
.note{background:var(--accent-soft);border-radius:9px;padding:9px 11px;font-size:.92rem;margin:0}
.note.warn{background:var(--warn-soft)}
.match{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;color:inherit}
.match + .match{margin-top:6px}
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){#modal{align-items:center}.sheet{border-radius:18px}}
#toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
#toast button{appearance:none;border:0;background:none;color:var(--surface);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
.setup{max-width:460px;margin:8vh auto 0}
.brand{font-family:var(--display);font-weight:700;font-size:2.2rem;text-transform:uppercase;line-height:1;margin:0}
.brand span{color:var(--accent)}
details>summary{cursor:pointer;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;font:600 .92rem var(--body);padding:8px;border-radius:8px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.calnav{display:flex;align-items:center;gap:10px}
.calnav .t{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.month .dow{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);padding:2px 0}
.month .day{appearance:none;border:0;background:transparent;border-radius:8px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0 3px;gap:1px;cursor:pointer;color:var(--ink);font:600 .92rem var(--body)}
.month .day i{font-style:normal;color:var(--accent);font-size:.8rem;line-height:1;letter-spacing:1px}
.month .day.out{color:var(--muted);opacity:.5}
.month .day.now span{background:var(--accent);color:var(--accent-ink);border-radius:12px;min-width:24px;padding:0 4px}
.month .day.sel{background:var(--accent-soft)}
.next{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.next .when{font-size:.85rem;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.next .who{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.1;color:inherit;text-decoration:none}
.next .big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.next .big .btn{min-height:52px;font-size:1rem}
.btn svg{width:20px;height:20px;flex-shrink:0}
.quick .btn svg{width:22px;height:22px}
.sheet .sec-top{flex-wrap:nowrap}
.sheet .sec-top h2{min-width:0;overflow-wrap:anywhere}
.sheet .sec-top .btn{flex-shrink:0}
.step{display:flex;flex-direction:column;gap:8px}
.step .btn.go{min-height:56px;font-size:1.08rem}
.stline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stline select{max-width:190px;padding:7px 9px;font-size:.92rem}
.gear{appearance:none;border:0;background:var(--sunk);width:38px;height:38px;border-radius:19px;display:grid;place-items:center;flex-shrink:0;color:var(--ink);text-decoration:none}
.gear svg{width:20px;height:20px}
.letter{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:2;background:var(--surface);font:700 .78rem var(--body);color:var(--accent);padding:4px 2px;margin:0 -2px;border-top:0!important;border-bottom:1px solid var(--line)}
.letter + .item{border-top:0!important}
#cust-list.has-rail{margin-right:22px}
.az-rail{position:fixed;z-index:15;right:max(2px,env(safe-area-inset-right,0px));top:calc(57px + env(safe-area-inset-top,0px));bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));width:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.az-rail span{display:block;width:24px;text-align:center;font:700 .66rem/1.45 var(--body);color:var(--accent);cursor:pointer}
.az-pop{position:fixed;z-index:30;left:50%;top:45%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:18px;background:rgba(29,34,32,.82);color:#fff;font:700 2.4rem var(--display);display:grid;place-items:center;pointer-events:none}
.az-pop[hidden]{display:none}
.fab.qk{right:calc(max(16px,env(safe-area-inset-right,0px)) + 118px);background:var(--surface);color:var(--accent);border:2px solid var(--accent);padding:0 16px}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;font-size:.85rem}
.wk button{appearance:none;border:0;background:var(--sunk);text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:0;font:inherit;min-width:0}
.wk button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk button b{font-weight:700}
.wk button.sel{background:var(--accent-soft);outline:2px solid var(--accent)}
.sheet > *{flex-shrink:0}
.wk .free{color:var(--good)}
.qk-prev{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.qk-row{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center}
.qk-row > span{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mic{min-height:56px;font-size:1.05rem}
.mic.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.75}}

.pill.st-check{background:var(--warn-soft);color:var(--warn)}

.fin-total b{font-family:var(--display);font-size:1.8rem}

<body>
<header class="top"><div class="top-in" id="topbar"></div></header>
<main id="main"></main>
<nav class="nav" id="nav" hidden></nav>
<button class="fab qk" id="fabq" data-act="quickOpen" hidden aria-label="Quick add">⚡ Quick</button>
<a class="fab" id="fab" href="#new" hidden>+ Job</a>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
const VERSION='1.8.0';
const errLog=[];const trail=[];
window.addEventListener('error',e=>{errLog.push(new Date().toISOString().slice(11,19)+' '+String(e.message||e.error||'error').slice(0,200)+(e.lineno?' (line '+e.lineno+')':''));if(errLog.length>10)errLog.shift();});
window.addEventListener('unhandledrejection',e=>{errLog.push(new Date().toISOString().slice(11,19)+' '+String((e.reason&&e.reason.message)||e.reason||'promise error').slice(0,200));if(errLog.length>10)errLog.shift();});

/* ============ small helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};

async function api(body,timeout){
  if(!conn)throw Object.assign(new Error('not_connected'),{code:'not_connected'});
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeout||30000);
  let res;
  try{res=await fetch(conn.url,{method:'POST',body:JSON.stringify(Object.assign({pass:conn.pass},body)),redirect:'follow',signal:ctl.signal});}
  catch(e){throw Object.assign(new Error('offline'),{code:'offline'});}
  finally{clearTimeout(t);}
  let j;try{j=await res.json();}catch(e){throw Object.assign(new Error('bad_response'),{code:'bad_response'});}
  if(!j.ok)throw Object.assign(new Error(j.error||'error'),{code:j.error||'error',detail:j.detail});
  return j;
}
function errText(e){
  switch(e&&e.code){
    case 'wrong_passcode':return 'Wrong passcode, or too many tries. Check the passcode in your Google Sheet script.';
    case 'offline':return 'No connection. Your changes are kept on this phone and will save when you’re back online.';
    case 'busy':return 'The sheet is busy. Trying again shortly.';
    case 'bad_response':return 'The connection link doesn’t look right. Check it in Settings.';
    default:return 'Something went wrong saving. It will try again.';
  }
}
let flushing=false,retryT=null,loading=false,sentDuringLoad=[];
async function flush(){
  if(flushing||!outbox.length||!conn)return;
  flushing=true;sync.busy=true;renderTop();
  const ops=outbox.slice(0,25);
  try{
    const r=await api({action:'batch',ops});
    const failed=(r.results||[]).filter(x=>!x.ok).length;
    outbox=outbox.slice(ops.length);lsSet('mhr-outbox',outbox);if(loading)sentDuringLoad.push(...ops);
    sync.err='';if(failed)toast(`${failed} change${failed>1?'s':''} couldn’t be saved to the sheet`);
  }catch(e){
    sync.err=e.code||'error';
    if(e.code==='wrong_passcode'){flushing=false;sync.busy=false;renderTop();return;}
    clearTimeout(retryT);retryT=setTimeout(flush,e.code==='offline'?20000:8000);
  }
  flushing=false;sync.busy=false;renderTop();
  if(outbox.length&&!sync.err)setTimeout(flush,100);
}

function quickParse(text, customers, todayYmd) {
  var out = { raw: String(text || ''), name: '', customerId: '', matches: [], phone: '', date: '', time: '', title: '', note: '' };
  var s = ' ' + String(text || '').replace(/\s+/g, ' ').trim() + ' ';
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var ymdOf = function (d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
  var tp = String(todayYmd || '').split('-').map(Number);
  var today = tp.length === 3 && tp[0] ? new Date(tp[0], tp[1] - 1, tp[2]) : new Date();
  var addD = function (n) { var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + n); return ymdOf(d); };
  var THING = /^(fix|fixing|install|hang|replace|repair|mount|paint|change|check|look|put|take|build|assemble|clean|move|patch|caulk|unclog|seal|adjust|remove|tighten|level|service|drywall|door|doors|sink|toilet|faucet|tv|shelf|shelves|light|lights|fan|window|windows|deck|fence|leak|leaky|leaking|gate|lock|outlet|switch|closet|cabinet|cabinets|sukkah|sukka|blinds|shades|mirror|pictures?|frame|handle|knob|hinge|hinges|stairs|railing|floor|tile|grab|bars?|smoke|detector|furniture|bed|crib|desk|table|chair|dryer|washer|dishwasher|vent|gutter|gutters|roof|wall|walls|ceiling|bathroom|kitchen|basement|garage|various|multi|estimate|quote)$/i;
  var cut = function (re) { var m = s.match(re); if (m) s = s.replace(m[0], ' '); return m; };

  // phone number
  var m = cut(/(?:\+?1[\s.\-]?)?\(?\b(\d{3})\)?[\s.\-]?(\d{3})[\s.\-]?(\d{4})\b/);
  if (m) out.phone = m[1] + '-' + m[2] + '-' + m[3];

  // date words
  var DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  var MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  if ((m = cut(/\b(?:on\s+)?(?:the\s+)?day after tomorrow\b/i))) out.date = addD(2);
  else if ((m = cut(/\b(?:for\s+|on\s+)?today\b|\btonight\b|\bthis\s+(?:afternoon|evening|morning)\b/i))) out.date = addD(0);
  else if ((m = cut(/\b(?:for\s+|on\s+)?tomorrow\b|\btmrw\b/i))) out.date = addD(1);
  if (!out.date && (m = cut(/\b(?:on\s+|for\s+)?(?:(this|next|coming)\s+)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|rsday|urday|sday)?\b\.?/i))) {
    var key = m[2].toLowerCase().slice(0, 3);
    var idx = DAYS.map(function (d) { return d.slice(0, 3); }).indexOf(key);
    var diff = (idx - today.getDay() + 7) % 7; if (diff === 0) diff = 7;
    if (m[1] && /next/i.test(m[1]) && diff < 3) diff += 7;
    out.date = addD(diff);
  }
  if (!out.date && (m = cut(/\b(?:on\s+)?(?:the\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
    var yy = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : today.getFullYear();
    var dd = new Date(yy, Number(m[1]) - 1, Number(m[2]));
    if (!m[3] && dd < today) dd.setFullYear(yy + 1);
    out.date = ymdOf(dd);
  }
  if (!out.date && (m = cut(/\b(?:on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b/i))) {
    var mi = MONTHS.indexOf(m[1].toLowerCase().slice(0, 3));
    var d2 = new Date(today.getFullYear(), mi, Number(m[2])); if (d2 < today) d2.setFullYear(d2.getFullYear() + 1);
    out.date = ymdOf(d2);
  }
  if (!out.date && (m = cut(/\b(?:on\s+)?the\s+(\d{1,2})(?:st|nd|rd|th)\b/i))) {
    var d3 = new Date(today.getFullYear(), today.getMonth(), Number(m[1])); if (d3 < today) d3.setMonth(d3.getMonth() + 1);
    out.date = ymdOf(d3);
  }
  if (!out.date && (m = cut(/\b(?:sometime\s+)?(next week|this week|later this week|end of (?:the )?week)\b/i))) out.note = m[1];

  // time
  if ((m = cut(/\b(?:at\s+|around\s+|by\s+)?(noon|midday)\b/i))) out.time = '12:00';
  else if ((m = cut(/\b(?:at\s+|around\s+|by\s+)?(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?|am|pm|o'?clock)(?=\W)/i)) ||
           (m = cut(/\b(?:at|around|by)\s+(\d{1,2})(?::(\d{2}))?\b/i)) ||
           (m = cut(/\b(\d{1,2}):(\d{2})\b/))) {
    var h = Number(m[1]), mm = m[2] ? Number(m[2]) : 0, ap = (m[3] || '').toLowerCase().replace(/\./g, '');
    if (h <= 23 && mm < 60) {
      if (ap === 'pm' && h < 12) h += 12;
      else if (ap === 'am' && h === 12) h = 0;
      else if (!ap || ap.indexOf('clock') >= 0) { if (h >= 1 && h <= 6) h += 12; }
      out.time = p2(h) + ':' + p2(mm);
    }
  }
  if (!out.time && (m = cut(/\b(?:in the\s+)?(morning|afternoon|evening)\b/i))) out.note = (out.note ? out.note + ', ' : '') + m[1];

  // customer: phone match first, then full name, then last name
  var norm = function (x) { return String(x || '').toLowerCase().replace(/^(rabbi|mrs?\.?|ms\.?|dr\.?)\s+/, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); };
  var digits = function (x) { return String(x || '').replace(/\D/g, ''); };
  s = s.replace(/^\s*(?:a\s+)?new\s+(?:customer|client|guy|lady|person|caller)\b[,:]?\s*/i, ' ');
  var COMMON = { guy: 1, shades: 1, project: 1, house: 1, school: 1, shul: 1, door: 1, doors: 1, lady: 1, man: 1, office: 1, window: 1, back: 1, front: 1, light: 1, lights: 1, sink: 1 };
  var low = ' ' + norm(s) + ' ';
  var custs = customers || [];
  var byPhone = out.phone ? custs.filter(function (c) { return digits(c.phone).slice(-10) === digits(out.phone).slice(-10) || digits(c.phone2).slice(-10) === digits(out.phone).slice(-10); }) : [];
  var hit = [];
  if (byPhone.length) hit = byPhone;
  else {
    var full = custs.filter(function (c) { var n = norm(c.name); return n.length >= 3 && low.indexOf(' ' + n + ' ') >= 0; });
    if (full.length) { var longest = Math.max.apply(null, full.map(function (c) { return norm(c.name).length; })); hit = full.filter(function (c) { return norm(c.name).length === longest; }); }
    else {
      hit = custs.filter(function (c) { var w = norm(c.name).split(' '); var last = w[w.length - 1]; return w.length > 1 && last.length >= 3 && !COMMON[last] && low.indexOf(' ' + last + ' ') >= 0; });
      // "David Klein, ..." is a new person, even if a customer's last name is "David"
      var seg = norm(s.replace(/^[\s,.\-–]+/, '').split(/[,;]|\s[-–]\s/)[0]).split(' ').filter(Boolean);
      if (hit.length && seg.length >= 2 && seg.length <= 4 && /[,;]|\s[-–]\s/.test(s)) {
        hit = hit.filter(function (c) { var w = norm(c.name).split(' '); return w[w.length - 1] === seg[seg.length - 1]; });
      }
      var lw = low.trim().split(' ');
      if (hit.length && lw.length >= 3 && /^[a-z][a-z'\-]+$/.test(lw[1]) && !THING.test(lw[1]) && THING.test(lw[2])) {
        hit = hit.filter(function (c) { var w = norm(c.name).split(' '); return w[w.length - 1] !== lw[0]; });
      }
      if (!hit.length) hit = custs.filter(function (c) { var w = norm(c.name).split(' '); return w.length === 1 && w[0].length >= 4 && !COMMON[w[0]] && low.indexOf(' ' + w[0] + ' ') >= 0; });
    }
  }
  out.matches = hit.map(function (c) { return c.id; });
  var removeName = function (nm) {
    var words = String(nm).replace(/^(rabbi|mrs?\.?|ms\.?|dr\.?)\s+/i, '').split(/\s+/).filter(Boolean);
    var re = new RegExp('\\b(?:(?:rabbi|mrs?\\.?|ms\\.?|dr\\.?)\\s+)?(?:' + words.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('\\s+') + ')(?:\'s)?\\b', 'i');
    if (re.test(s)) { s = s.replace(re, ' '); return true; }
    var last = words[words.length - 1];
    var re2 = new RegExp('\\b(?:(?:rabbi|mrs?\\.?|ms\\.?|dr\\.?)\\s+)?(?:[a-z]+\\s+)?' + last.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\'s)?\\b', 'i');
    if (re2.test(s)) { s = s.replace(re2, ' '); return true; }
    return false;
  };
  if (hit.length) {
    out.customerId = hit.length === 1 ? hit[0].id : '';
    out.name = hit[0].name;
    removeName(hit[0].name);
  } else {
    // new customer: first comma part, or words before "needs/wants/for/..."
    var t = s.replace(/^[\s,.\-–]+/, '');
    var parts = t.split(/[,;]|\s[-–]\s/);
    var cand = '';
    if (parts.length > 1 && parts[0].trim().split(/\s+/).length <= 4) cand = parts[0].trim();
    else {
      var mv = t.match(/^((?:(?:rabbi|mrs?\.?|ms\.?|dr\.?)\s+)?[A-Za-z'\-]+(?:\s+[A-Za-z'\-]+){0,2}?)\s+(?:needs|wants|would like|asked|called|is asking|has|for|about|to)\b/i);
      if (mv) cand = mv[1];
      else { var mc = t.match(/^((?:(?:Rabbi|Mrs?\.?|Ms\.?|Dr\.?)\s+)?[A-Z][a-z'\-]+(?:\s+[A-Z][a-z'\-]+)?)\b/); if (mc) cand = mc[1]; }
    }
    var JOBWORD = /^(call|fix|check|replace|install|hang|mount|repair|paint|look|someone|somebody|guy|lady|a|an|the|need|needs|get|go|pick|buy|bring|text|email|follow)$/i;
    if (cand && (JOBWORD.test(cand.split(/\s+/)[0]) || THING.test(cand.split(/\s+/)[0]))) cand = '';
    // "tv mount for feldman" → Feldman
    if (!cand) { var mf = t.match(/\bfor\s+((?:(?:rabbi|mrs?\.?|ms\.?|dr\.?)\s+)?[A-Za-z'\-]+(?:\s+[A-Za-z'\-]+)?)\s*[,.]?\s*$/i); if (mf && !JOBWORD.test(mf[1].split(/\s+/)[0])) cand = mf[1]; }
    // typed without commas or capitals: "feldman tv mount", "david klein fix door"
    if (!cand) {
      var w = t.trim().split(/\s+/);
      if (w.length >= 2 && !JOBWORD.test(w[0]) && !THING.test(w[0]) && !/^\d/.test(w[0])) {
        cand = w[0];
        if (w.length >= 3 && !THING.test(w[1]) && !JOBWORD.test(w[1]) && THING.test(w[2])) cand = w[0] + ' ' + w[1];
      }
    }
    if (cand) { s = s.replace(cand, ' '); out.name = cand.replace(/\s+/g, ' ').trim().replace(/(^|\s)([a-z])/g, function (x, sp, ch) { return sp + ch.toUpperCase(); }); }
  }

  // what's left is the job
  var title = s.replace(/\s+/g, ' ')
    .replace(/^[\s,.;:\-–]+|[\s,.;:\-–]+$/g, '')
    .replace(/^(?:(?:who|that|he|she|they)\s+)?(?:needs|wants|would like|asked (?:me )?(?:for|to)|called (?:about|for)|is asking (?:for|about)|has|for|about|to|job(?: is)?:?)\s+/i, '')
    .replace(/^(?:a|an|the|some|his|her|their)\s+/i, '')
    .replace(/\s+(?:on|at|for|by|around)$/i, '')
    .replace(/\s*,\s*,+/g, ',').replace(/^[\s,.;:\-–]+|[\s,.;:\-–]+$/g, '');
  title = title.replace(/\btv\b/gi, 'TV').replace(/\bac\b/gi, 'AC');
  out.title = title ? title.charAt(0).toUpperCase() + title.slice(1) : '';
  return out;
}

function totals(j){
  const matCost=num(j.materials);const mup=matCost>0?r2(matCost*num(j.matMarkup)/100+num(j.matMarkupFlat)):0;const mat=matCost+mup;let labor;
  if(j.priceType==='hourly'){const h=num(j.hoursWorked);labor=h>0?num(j.serviceFee)+Math.max(0,h-num(j.includedHours))*num(j.hourlyRate):0;}
  else labor=num(j.flatPrice);
  return {labor:r2(labor),mat:r2(mat),matCost:r2(matCost),mup,total:r2(labor+mat)};
}
const jobPays=j=>D.payments.filter(p=>p.jobId===j.id);
const jobPaid=j=>r2(jobPays(j).reduce((s,p)=>s+num(p.amount),0));
const jobBal=j=>Math.max(0,r2(totals(j).total-jobPaid(j)));
const getJob=id=>D.jobs.find(j=>j.id===id);
const getCust=id=>D.customers.find(c=>c.id===id);
const custName=id=>(getCust(id)||{}).name||'No customer';
const custJobs=c=>D.jobs.filter(j=>j.customerId===c.id);
function custStats(c){
  const js=custJobs(c);
  const paid=r2(D.payments.filter(p=>p.customerId===c.id).reduce((s,p)=>s+num(p.amount),0));
  const labor=r2(js.filter(j=>['done','unpaid','paid'].includes(j.status)).reduce((s,j)=>s+totals(j).labor,0));
  const owes=r2(js.filter(j=>['done','unpaid'].includes(j.status)).reduce((s,j)=>s+jobBal(j),0));
  const done=js.filter(j=>['done','unpaid','paid'].includes(j.status));
  const dates=done.map(j=>j.date||'').filter(Boolean).sort();
  return {jobs:js.length,doneCount:done.length,paid,labor,owes,last:dates.length?dates[dates.length-1]:'',firstD:dates[0]||'',open:js.filter(j=>OPEN.includes(j.status)&&j.status!=='done'&&j.status!=='unpaid').length};
}
function invNo(j){const d=j.invoicedAt?new Date(j.invoicedAt):new Date();return `INV-${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}-${String(j.id).replace(/[^a-zA-Z0-9]/g,'').slice(-4).toUpperCase()}`;}

function tmpl(kind,j,c){
  c=c||getCust(j&&j.customerId)||{};const f=first(c.name);const sig=` – ${S().signName}`;const job=j&&j.title?(j.title.charAt(0).toLowerCase()+j.title.slice(1)):'the repair';

    case 'remind':return `Hi ${f}, just a reminder that I’ll be there ${j&&j.date&&parseYmd(j.date).getDay()===0&&new Date().getDay()===5?'on Sunday':'tomorrow'}${j&&j.time?' at '+fmtTime(j.time):''} for ${job}. If anything changes, just reply here.${sig}`;

function invoiceText(j){
  const c=getCust(j.customerId)||{};const t=totals(j);const paid=jobPaid(j);

    if(!qk)return;qk.text=(base+finalTxt+interim).trim();const ta=$('#qk-text');if(ta)ta.value=qk.text;qkRefresh();};
  rec.onerror=e=>{if(!qk)return;qk.listening=false;renderQuick();if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('Allow the microphone for this app to talk to it');else if(e.error!=='aborted'&&e.error!=='no-speech')toast('Didn’t catch that. Try again.');};

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.82);
  }catch(e){
    return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.82));};img.onerror=rej;img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});
  }
}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder();const parts=[],central=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  files.forEach(f=>{const nm=enc.encode(f.name);const crc=crc32(f.data);const sz=f.data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,f.data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+sz;});
  const cd=central.reduce((a,x)=>a+x.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cd),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc=v=>String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colL=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
const xlDate=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?Math.round((Date.UTC(+m[1],m[2]-1,+m[3])-Date.UTC(1899,11,30))/86400000):null;};
function sheetXml(cols,rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w||14}" customWidth="1"/>`).join('')+'</cols><sheetData>';
  x+='<row r="1">'+cols.map((c,i)=>`<c r="${colL(i)}1" t="inlineStr" s="1"><is><t>${xesc(c.h)}</t></is></c>`).join('')+'</row>';
  rows.forEach((r,ri)=>{const n=ri+2;x+=`<row r="${n}">`;r.forEach((v,i)=>{if(v===''||v===null||v===undefined)return;const ref=colL(i)+n,t=cols[i].t;
    if(t==='d'){const sn=xlDate(v);if(sn!==null){x+=`<c r="${ref}" s="2"><v>${sn}</v></c>`;return;}}
    if((t==='m'||t==='n')&&typeof v==='number'&&isFinite(v)){x+=`<c r="${ref}" s="${t==='m'?3:4}"><v>${Math.round(v*100)/100}</v></c>`;return;}
    x+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;});x+='</row>';});

function buildXlsx(sheets){

/* ============ calendar ============ */
function gcal(j){
  if(!j.date)return '';const c=getCust(j.customerId)||{};const [y,m,d]=j.date.split('-').map(Number);
  const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const p={action:'TEMPLATE',text:`${j.title||'Job'} – ${c.name||''}`};
  if(j.time){const [hh,mm]=j.time.split(':').map(Number);const s=new Date(y,m-1,d,hh,mm);const e=new Date(s.getTime()+(num(j.hours)||1)*3600000);p.dates=`${f(s)}/${f(e)}`;p.ctz='America/Chicago';}
  else{const s=new Date(y,m-1,d);p.dates=`${ymd(s).replace(/-/g,'')}/${ymd(addDays(s,1)).replace(/-/g,'')}`;}
  p.details=[j.description,c.phone?'Phone: '+c.phone:'',c.notes?'Notes: '+c.notes:''].filter(Boolean).join('\n');if(c.address)p.location=c.address;
  return 'https://calendar.google.com/calendar/render?'+new URLSearchParams(p).toString();
}

/* ---------- sukkah season ---------- */
const isSukkahJob=j=>/sukk|suka/i.test(String(j.title||'')+' '+String(j.description||''));
function sukkahSeason(){const n=new Date();const y=n.getMonth()>=10?n.getFullYear()+1:n.getFullYear();return {y,from:`${y-1}-11-01`,show:`${y}-${S().sukkahStart||'08-01'}`,until:`${y}-10-31`};}
function sukkahList(){
  const se=sukkahSeason();const out={todo:[],booked:[]};
  D.customers.forEach(c=>{
    const js=custJobs(c).filter(isSukkahJob);if(!js.length)return;
    const thisYear=js.filter(j=>j.status!=='cancelled'&&((j.date&&j.date>=se.from)||(!j.date&&String(j.createdAt||'')>=se.from)));
    const past=js.filter(j=>j.date&&j.date<se.from&&['done','unpaid','paid'].includes(j.status)).sort((a,b)=>b.date.localeCompare(a.date));
    if(!past.length&&!thisYear.length)return;
    const row={c,past,thisYear,paid:r2(past.reduce((s,j)=>s+totals(j).total,0))};
    (thisYear.length?out.booked:out.todo).push(row);
  });
  out.todo.sort((a,b)=>b.paid-a.paid);return out;
}
function viewSukkah(){
  const se=sukkahSeason();const L=sukkahList();
  const line=x=>`<div class="item" style="flex-wrap:wrap"><a class="l" href="#customer/${x.c.id}" style="color:inherit;text-decoration:none"><b>${esc(x.c.name)}</b><span>${esc(x.past.slice(0,3).map(j=>j.title+' · '+parseYmd(j.date).toLocaleDateString('en-US',{month:'short',year:'numeric'})).join(' · ')||'')}</span></a>
    <span class="r"><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-act="msgSukkah" data-id="${x.c.id}">${ICON.text} Message</button><a class="btn sm p" href="#new/${x.c.id}" data-act="bookSukkah" data-id="${x.c.id}">+ Book</a></span></span></div>`;
  return `<p class="muted small m0">Customers who had sukkah work before, for Sukkos ${se.y}. Message them early to fill the busy weeks before Yom Tov. Anyone you book a sukkah job for moves to “Booked”.</p>
  <section class="card"><div class="sec-top"><h2 class="sec">Not booked yet</h2><span class="small muted">${L.todo.length}</span></div>
    ${L.todo.length?`<div class="list">${L.todo.map(line).join('')}</div>`:'<p class="empty small">Everyone from before is booked.</p>'}</section>
  ${L.booked.length?`<section class="card"><div class="sec-top"><h2 class="sec">Booked</h2><span class="small muted">${L.booked.length}</span></div><div class="list">${L.booked.map(x=>`<a class="item" href="#customer/${x.c.id}"><span class="l"><b>${esc(x.c.name)}</b><span>${esc(x.thisYear.map(j=>j.title+(j.date?' · '+fmtDate(j.date):'')).join(' · '))}</span></span></a>`).join('')}</div></section>`:''}
  <p class="muted small m0">Tip: when you book the put-up, add the take-down as a second job right away.</p>`;
}

/* ---------- week & month ---------- */
const dayJobs=d=>D.jobs.filter(j=>j.date===d&&j.status!=='cancelled').sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const dayHours=L=>L.reduce((s,j)=>s+(num(j.hours)||num(j.hoursWorked)||0),0);
function weekStart(d){const x=parseYmd(d);x.setDate(x.getDate()-x.getDay());return x;}
function viewWeek(){
  const t=today();const ws=weekStart(ui.calDay||t);const we=addDays(ws,6);
  const days=[...Array(7)].map((_,i)=>ymd(addDays(ws,i)));
  const all=days.map(dayJobs);const n=all.reduce((s,L)=>s+L.length,0);const h=all.reduce((s,L)=>s+dayHours(L),0);
  const head=`<div class="calnav"><button class="btn sm" data-act="calMove" data-n="-7" aria-label="Previous week">‹</button><div class="t"><b>${ws.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${we.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</b><span class="small muted">${n} job${n===1?'':'s'}${h?` · about ${fmtH(h)} booked`:''}</span></div><button class="btn sm" data-act="calMove" data-n="7" aria-label="Next week">›</button></div>
  ${days.includes(t)?'':'<div><button class="btn ghost sm" data-act="calToday">Back to this week</button></div>'}`;
  return head+days.map((d,i)=>{const L=all[i];if(!L.length&&parseYmd(d).getDay()===6)return '';const hh=dayHours(L);
    return `<section class="card ${d===t?'hi':''}" style="gap:4px"><div class="sec-top"><h2 class="sec">${parseYmd(d).toLocaleDateString('en-US',{weekday:'long'})} <span class="muted" style="font-weight:600">${parseYmd(d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>${d===t?' <span class="pill st-scheduled">Today</span>':''}</h2><span class="small muted">${L.length?`${L.length} job${L.length===1?'':'s'}${hh?' · '+fmtH(hh):''}`:''}</span></div>
      ${L.length?`<div class="list">${L.map(j=>jobLine(j,{sub:j.time?fmtTime(j.time):''})).join('')}</div>`:`<p class="empty small">Free</p>`}
      <div><a class="btn ghost sm" href="#new" data-act="newOn" data-d="${d}">+ Add a job this day</a></div></section>`;}).join('');
}
function viewMonth(){
  const t=today();const sel=ui.calDay||t;const m0=parseYmd(sel);m0.setDate(1);
  const start=addDays(m0,-m0.getDay());const mo=m0.getMonth();
  const cells=[...Array(42)].map((_,i)=>addDays(start,i));const rows=cells[35].getMonth()===mo?6:5;
  const L=dayJobs(sel);
  const monthJobs=D.jobs.filter(j=>j.date&&j.date.slice(0,7)===ymd(m0).slice(0,7)&&j.status!=='cancelled');

  ${ymd(m0).slice(0,7)===t.slice(0,7)?'':'<div><button class="btn ghost sm" data-act="calToday">Back to this month</button></div>'}
  <section class="card" style="padding:10px"><div class="month">${['S','M','T','W','T','F','S'].map(x=>`<span class="dow">${x}</span>`).join('')}
    ${cells.slice(0,rows*7).map(c=>{const d=ymd(c);const J=dayJobs(d);return `<button class="day ${c.getMonth()!==mo?'out':''} ${d===t?'now':''} ${d===sel?'sel':''}" data-act="calPick" data-d="${d}" aria-label="${c.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}, ${J.length} jobs"><span>${c.getDate()}</span>${J.length?`<i>${J.length>3?J.length:'•'.repeat(J.length)}</i>`:''}</button>`;}).join('')}</div></section>
  <section class="card"><div class="sec-top"><h2 class="sec">${fmtLong(sel)}</h2><span class="small muted">${L.length?`${L.length} job${L.length===1?'':'s'}`:''}</span></div>
    ${L.length?`<div class="list">${L.map(j=>jobLine(j,{sub:j.time?fmtTime(j.time):''})).join('')}</div>`:'<p class="empty small">Nothing on this day.</p>'}
    <div><a class="btn ghost sm" href="#new" data-act="newOn" data-d="${sel}">+ Add a job this day</a></div></section>`;
}

/* ---------- waiting list ---------- */
function viewWaiting(){
  const W=D.jobs.filter(isWaiting);

  const key=j=>j.status==='scheduled'?'slotted':j.status;
  const by=g=>W.filter(j=>key(j)===g).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));

/* ---------- jobs ---------- */
const isWaiting=j=>WAITING.includes(j.status)||(j.status==='scheduled'&&!j.date);
const needsMoney=j=>['done','unpaid'].includes(j.status)&&(jobBal(j)>0||totals(j).total<=0);
const JOB_FILTERS=[['open','To do',j=>['new','waiting','followup','scheduled'].includes(j.status)],['scheduled','On the schedule',j=>j.status==='scheduled'&&!!j.date],['unpaid','Unpaid',needsMoney],['paid','Paid',j=>j.status==='paid'],['all','All',()=>true]];
function filteredJobs(){
  const f=(JOB_FILTERS.find(x=>x[0]===ui.jobFilter)||JOB_FILTERS[0])[2];const q=ui.jobSearch.trim().toLowerCase();
  return D.jobs.filter(f).filter(j=>!q||[j.title,j.description,custName(j.customerId),(getCust(j.customerId)||{}).phone,(getCust(j.customerId)||{}).address].join(' ').toLowerCase().includes(q))
    .sort((a,b)=>{if(ui.jobFilter==='scheduled'||ui.jobFilter==='open'){const ad=a.date||'9999',bd=b.date||'9999';return ad.localeCompare(bd)||(a.time||'').localeCompare(b.time||'');}return (b.date||b.createdAt||'').localeCompare(a.date||a.createdAt||'');});

function viewJobs(){

function saveDraft(){
  const d=draft;
  if(!d.title.trim()){toast('Add what needs doing');$('#nj-title')?.focus();return;}
  let cid=d.customerId;
  if(d.custMode==='newcust'){
    if(!d.name.trim()){toast('Add the customer’s name');$('#nc-name')?.focus();return;}
    const c=put('Customers',{id:uid('c'),name:d.name.trim(),phone:d.phone.trim(),address:d.address.trim(),email:d.email.trim(),source:d.source,notes:'',tags:''},true);cid=c.id;
  }else if(!cid){toast('Choose a customer or add a new one');return;}
  const st=d.status==='new'&&d.date?'scheduled':d.status;
  const pr=(S().rates||[])[num(String(d.priceType).split(':')[1])]||defRate();
  const j=put('Jobs',{id:uid('j'),customerId:cid,title:d.title.trim(),description:d.description.trim(),status:st,date:d.date,time:d.time,hours:d.hours,priceType:d.priceType==='flat'?'flat':'hourly',flatPrice:d.priceType==='flat'?num(d.flatPrice):'',hoursWorked:'',materials:'',matMarkup:S().markupOn?num(S().markupPct):'',matMarkupFlat:S().markupOn&&num(S().markupFlat)?num(S().markupFlat):'',serviceFee:num(pr.fee),includedHours:num(pr.inc),hourlyRate:num(pr.rate),notes:''},true);
  if(d.todo.trim())put('Todos',{id:uid('t'),text:d.todo.trim(),due:d.date||'',done:false,doneAt:'',jobId:j.id},true);

function nextStep(j){
  const t=totals(j),bal=jobBal(j),td=today();
  const b=(act,label,cls,extra)=>`<button class="btn ${cls||'p'} go wide" data-act="${act}" data-id="${j.id}" ${extra||''}>${label}</button>`;
  const small=(act,label,k)=>`<button class="btn sm" data-act="${act}" data-id="${j.id}" ${k?`data-k="${k}"`:''}>${label}</button>`;
  const hint=x=>`<p class="muted small m0">${x}</p>`;
  switch(j.status){
    case 'new':case 'waiting':case 'followup':
      return j.date?b('finishOpen','✓ Finish job','p')+hint('When the work is done, tap Finish to add hours, materials and an after photo.')
        :b('pickDate','📅 Pick a date to schedule it','p')+`<div class="row">${small('msgJob','Message','confirm')}${j.status!=='followup'?small('quickStatus','Need to follow up','followup'):''}${j.status!=='waiting'?small('quickStatus','Waiting on reply','waiting'):''}</div>`;
    case 'scheduled':
      return (j.date&&j.date>td?`<div class="row">${small('msgJob','Confirm time','confirm')}${small('msgJob','Send reminder','remind')}${small('reschedOpen','📅 Reschedule')}</div>`:`<div class="row">${small('msgJob','On my way','omw')}${small('msgJob','Running late','late')}${small('reschedOpen','📅 Reschedule')}</div>`)+b('finishOpen','✓ Finish job','p');
    case 'done':
      return t.total>0?b('invoiceSend','Send invoice','p')+`<div class="row">${small('payOpen','Paid on the spot')}${small('msgJob','Text the invoice instead','invoice')}</div>`
        :b('finishOpen','Add the price','p')+hint('This job has no price yet.');
    case 'unpaid':
      return b('payOpen',`Record payment · ${money0(bal)}`,'g')+`<div class="row">${small('msgJob','Payment reminder','payremind')}${small('invoiceSend','Send invoice again')}</div>`;
    case 'paid':
      return j.reviewAskedAt?`<p class="m0"><b class="good">✓ All done.</b> <span class="muted small">Review asked ${fmtDateY(ymd(new Date(j.reviewAskedAt)))}.</span></p>`
        :b('msgJob','⭐ Thank you + ask for a review','p','data-k="thanks"')+hint(S().reviewLink?'Happy customers are the best time to ask.':'Add your Google review link in Settings so it’s included.');
    case 'cancelled':
      return b('quickStatus','Bring this job back','',`data-k="new"`);
  }
  return '';
}

function lastKey(n){n=String(n||'').trim().toLowerCase().replace(/^(rabbi|mrs?\.?|ms\.?|dr\.?)\s+/,'');const w=n.split(/\s+/);return (w.length>1?w[w.length-1]+' ':'')+n;}
function custOptions(sel){return `<option value="">Choose…</option>`+D.customers.slice().sort((a,b)=>lastKey(a.name).localeCompare(lastKey(b.name))).map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}${o.phone?' · '+esc(o.phone):''}</option>`).join('');}
function custRows(){
  const q=ui.custSearch.trim().toLowerCase();const d=digits(q);
  const l=D.customers.filter(c=>!q||normName(c.name).includes(normName(q))||(d.length>=3&&digits(c.phone).includes(d))||[c.address,c.email,c.tags,c.notes].join(' ').toLowerCase().includes(q)).map(c=>({c,s:custStats(c)}));
  const by={recent:(a,b)=>(b.s.last||b.c.createdAt||'').localeCompare(a.s.last||a.c.createdAt||''),paid:(a,b)=>b.s.paid-a.s.paid,jobs:(a,b)=>b.s.doneCount-a.s.doneCount,owes:(a,b)=>b.s.owes-a.s.owes,az:(a,b)=>lastKey(a.c.name).localeCompare(lastKey(b.c.name))}[ui.custSort];
  l.sort(by);
  if(!l.length)return `<p class="empty">${D.customers.length?'No customers match.':'No customers yet. They’re added when you save a job.'}</p>`;
  const az=ui.custSort==='az'&&!q;let lastL='';

  const letters=az?[...new Set(l.map(x=>letterOf(x.c)))]:[];

}

/* ---------- money ---------- */
function viewMoney(){
  const now=new Date();const t=today();
  const ws=addDays(now,-((now.getDay()+6)%7));const wk=ymd(ws);const mo=t.slice(0,7);const yr=t.slice(0,4);
  const paidIn=f=>r2(D.payments.filter(p=>f(String(p.date||''))).reduce((s,p)=>s+num(p.amount),0));
  const doneJobs=D.jobs.filter(j=>['done','unpaid','paid'].includes(j.status)&&j.date);
  const laborIn=f=>{const js=doneJobs.filter(j=>f(j.date));const lab=js.reduce((s,j)=>{const t=totals(j);return s+t.labor+t.mup;},0);const h=js.reduce((s,j)=>s+num(j.hoursWorked),0);return {lab,h,n:js.length};};
  const W=laborIn(d=>d>=wk&&d<=t),M=laborIn(d=>d.startsWith(mo)),Y=laborIn(d=>d.startsWith(yr));
  const unpaid=D.jobs.filter(j=>['done','unpaid'].includes(j.status)&&jobBal(j)>0).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const owed=r2(unpaid.reduce((s,j)=>s+jobBal(j),0));
  const months=[...Array(12)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-11+i,1);const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;const x=laborIn(dd=>dd.startsWith(k));return {k,l:d.toLocaleDateString('en-US',{month:'short'}),lab:x.lab,h:x.h,n:x.n,cur:i===11};});
  const max=Math.max(1,...months.map(m=>m.lab),num(S().monthlyGoal));
  const top=D.customers.map(c=>({c,s:custStats(c)})).filter(x=>x.s.paid>0).sort((a,b)=>b.s.paid-a.s.paid).slice(0,8);
  const rate=x=>x.h?money0(x.lab/x.h)+'/hr':'–';
  return `
  <div class="tiles">
    <div class="tile"><span>This week</span><b>${money0(W.lab)}</b><span>${W.n} jobs · ${rate(W)}</span></div>
    <div class="tile"><span>This month</span><b>${money0(M.lab)}</b><span>${M.n} jobs · ${rate(M)}</span></div>
    <div class="tile"><span>This year</span><b>${money0(Y.lab)}</b><span>${Y.n} jobs · ${rate(Y)}</span></div>
    <div class="tile"><span>Owed to you</span><b class="${owed?'bad':''}">${money0(owed)}</b><span>${unpaid.length} job${unpaid.length===1?'':'s'}</span></div>
  </div>
  <p class="muted small m0">Earnings are labor plus any materials markup (the cost of materials is not counted), by job date. Collected this month, including materials: ${money0(paidIn(d=>d.startsWith(mo)))}.</p>
  <section class="card"><h2 class="sec">Last 12 months (earnings)</h2>
    <div class="bars" role="img" aria-label="Monthly labor earnings">${months.map(m=>`<div class="${m.cur?'cur':''}" style="height:${(m.lab/max*100).toFixed(1)}%" title="${m.l}: ${money0(m.lab)}"></div>`).join('')}</div>
    <div class="blab">${months.map(m=>`<span>${m.l}</span>`).join('')}</div>
    <details><summary>Show as a table</summary><table class="t"><thead><tr><th>Month</th><th>Jobs</th><th>Hours</th><th>Labor</th><th>Per hour</th></tr></thead><tbody>${months.slice().reverse().map(m=>`<tr><td>${m.l} ${m.k.slice(0,4)}</td><td>${m.n}</td><td>${r2(m.h)}</td><td>${money0(m.lab)}</td><td>${m.h?money0(m.lab/m.h):'–'}</td></tr>`).join('')}</tbody></table></details>
  </section>
  <section class="card"><div class="sec-top"><h2 class="sec">Owed to you</h2><b class="${owed?'bad':''}">${money0(owed)}</b></div>
    ${unpaid.length?`<div class="list">${unpaid.map(j=>jobLine(j,{sub:j.date?fmtDateY(j.date):'',right:`<b class="bad">${money0(jobBal(j))}</b>`})).join('')}</div>`:'<p class="empty">Everyone’s paid up.</p>'}
  </section>
  <section class="card"><h2 class="sec">Top customers</h2>
    ${top.length?`<div class="list">${top.map(({c,s})=>`<a class="item" href="#customer/${c.id}"><span class="l"><b>${esc(c.name)}</b><span>${s.doneCount} jobs</span></span><span class="r"><b>${money0(s.paid)}</b></span></a>`).join('')}</div>`:'<p class="empty">No payments yet.</p>'}
  </section>`;
}

function todoTick(id){
  const td=D.todos.find(x=>x.id===id);if(!td)return;const was=clone(td);
  put('Todos',Object.assign({},td,{done:!td.done,doneAt:!td.done?nowIso():''}));
  if(!was.done)toast('Done',()=>{put('Todos',Object.assign({},getTodo(id)||was,{done:false,doneAt:''}));});
}
const getTodo=id=>D.todos.find(x=>x.id===id);
const A={
  back:()=>{if(history.length>1)history.back();else location.hash='#today';},
  syncNow:()=>{sync.err='';if(outbox.length)flush();else refresh(true);},
  refresh:()=>refresh(true),
  undo:()=>{const f=undoFn;undoFn=null;$('#toast').hidden=true;if(f)f();},
  connect:async()=>{
    const url=($('#su-url').value||'').trim(),pass=($('#su-pass').value||'').trim();const errEl=$('#su-err');
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url)){errEl.innerHTML='<p class="err">That doesn’t look like the connection link. It starts with https://script.google.com/macros/s/ and ends with /exec.</p>';return;}
    if(!pass){errEl.innerHTML='<p class="err">Enter the passcode.</p>';return;}
    errEl.innerHTML='<p class="muted m0">Connecting…</p>';conn={url,pass};
    try{await api({action:'ping'});lsSet('mhr-conn',conn);location.hash='#today';await refresh(false);toast('Connected');}
    catch(e){conn=null;errEl.innerHTML=`<p class="err">${esc(e.code==='wrong_passcode'?'Wrong passcode. It must match the one in the script exactly (and can’t be CHANGE-ME).':e.code==='offline'?'Couldn’t reach the link. Check your connection and that the script is deployed for “Anyone”.':'That link didn’t answer correctly. Copy it again from Deploy → Manage deployments.')}</p>`;}
  },
  changeConn:async()=>{
    const pass=($('#cc-pass').value||'').trim(),url=($('#cc-url').value||'').trim();
    if(!pass&&!url){toast('Enter the new passcode');return;}
    if(url&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url)){toast('That link doesn’t look right');return;}
    const old=conn;conn=Object.assign({},conn,pass?{pass}:{},url?{url}:{});
    try{await api({action:'ping'});lsSet('mhr-conn',conn);sync.err='';toast('Saved');refresh(false);}
    catch(e){conn=old;toast(e.code==='wrong_passcode'?'That passcode wasn’t accepted':'Couldn’t connect with that');}
  },
  disconnect:()=>{if(outbox.length){toast('Wait until everything is saved first');return;}conn=null;try{localStorage.removeItem('mhr-conn');localStorage.removeItem('mhr-cache');}catch(e){}D=empty();render();},
  filterWaiting:()=>{ui.jobFilter='waiting';},

function markSent(){
  if(!msg)return;
  const j=msg.jobId&&getJob(msg.jobId);
  if(j&&msg.kind==='remind')put('Jobs',Object.assign({},j,{remindedFor:j.date}),true);
  if(j&&msg.kind==='invoice'&&!['unpaid','paid'].includes(j.status))put('Jobs',Object.assign({},j,{status:'unpaid',invoicedAt:j.invoicedAt||nowIso(),doneAt:j.doneAt||nowIso()}),true);
  if(j&&msg.kind==='thanks')put('Jobs',Object.assign({},j,{reviewAskedAt:nowIso()}),true);
  setTimeout(render,300);
}
